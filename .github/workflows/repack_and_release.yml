name: Repack and Release

on:
  workflow_dispatch:
  schedule:
    # 12:00 UTC / 20:00 CST
    - cron: "0 12 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  SOURCE_REPO: https://gitgud.io/Frostberg/degrees-of-lewdity-plus.git
  SOURCE_DIR: degrees-of-lewdity-plus

jobs:
  repack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone external repository
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          retry_wait_seconds: 180
          max_attempts: 7
          command: git clone "$SOURCE_REPO" "$SOURCE_DIR"

      - name: Set package version
        run: echo "MOD_VERSION=$(date +'%y-%m-%d')" >> "$GITHUB_ENV"

      - name: Prepare image pack variants
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d "$SOURCE_DIR/img/imagepacks" ]]; then
            imagepacks="$SOURCE_DIR/img/imagepacks"
          elif [[ -d "$SOURCE_DIR/imagepacks" ]]; then
            imagepacks="$SOURCE_DIR/imagepacks"
          else
            echo "::error::Could not find upstream imagepacks directory at $SOURCE_DIR/img/imagepacks or $SOURCE_DIR/imagepacks"
            exit 1
          fi

          copy_pack() {
            local pack="$1"
            local target="$2"
            if [[ ! -d "$imagepacks/$pack" ]]; then
              echo "::error::Could not find image pack '$pack' in $imagepacks"
              exit 1
            fi
            cp -r -f "$imagepacks/$pack"/. "$target/img/"
          }

          prepare_variant() {
            local target="$1"
            shift

            mkdir -p "$target/img"
            for pack in "$@"; do
              copy_pack "$pack" "$target"
            done
          }

          prepare_variant BEEESSS_Hikari_Female \
            b3s \
            kaervek \
            b3s_hikfem \
            b3s_hikfemsubs

          prepare_variant BEEESSS_Wax \
            b3s \
            kaervek \
            b3s_wax

          prepare_variant Goose_Female \
            goosefem \
            goosefemsubs

          prepare_variant Goose_Female_Mysterious \
            goosefem \
            goosefemsubs \
            mysterious

      - name: Package variants
        shell: bash
        run: |
          set -euo pipefail

          package_variant() {
            local mod_name="$1"

            (
              cd "$mod_name"
              MOD_NAME="$mod_name" MOD_VERSION="$MOD_VERSION" \
                python3 ../python/Art_Mods_Actions.py
            )

            mv "$mod_name/$mod_name.zip" "$mod_name.zip"
          }

          package_variant BEEESSS_Hikari_Female
          package_variant BEEESSS_Wax
          package_variant Goose_Female
          package_variant Goose_Female_Mysterious

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: art-mod-packages
          path: "*.zip"
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: repack

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release date
        run: echo "RELEASE_DATE=$(date +'%y-%m-%d')" >> "$GITHUB_ENV"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: art-mod-packages

      - name: Calculate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          sha256_bhf=$(shasum -a 256 BEEESSS_Hikari_Female.zip | awk '{print $1}')
          sha256_bw=$(shasum -a 256 BEEESSS_Wax.zip | awk '{print $1}')
          sha256_gf=$(shasum -a 256 Goose_Female.zip | awk '{print $1}')
          sha256_gfm=$(shasum -a 256 Goose_Female_Mysterious.zip | awk '{print $1}')

          {
            echo "SHA256_BHF=$sha256_bhf"
            echo "SHA256_BW=$sha256_bw"
            echo "SHA256_GF=$sha256_gf"
            echo "SHA256_GFM=$sha256_gfm"
          } >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "release-${{ env.RELEASE_DATE }}"
          name: "Release ${{ env.RELEASE_DATE }}"
          draft: false
          prerelease: false
          body: |
            ${{ env.RELEASE_DATE }}
            ## File SHA256 Checksums
            - BEEESSS_Hikari_Female.zip: `${{ env.SHA256_BHF }}`
            - BEEESSS_Wax.zip: `${{ env.SHA256_BW }}`
            - Goose_Female.zip: `${{ env.SHA256_GF }}`
            - Goose_Female_Mysterious.zip: `${{ env.SHA256_GFM }}`
            ## Verify Your Download
            PowerShell: `certutil -hashfile [file] sha256`
            Linux Terminal: `shasum -a 256 [file]`
          files: |
            BEEESSS_Hikari_Female.zip
            BEEESSS_Wax.zip
            Goose_Female.zip
            Goose_Female_Mysterious.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
